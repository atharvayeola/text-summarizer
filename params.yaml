training:
  arguments:
    num_train_epochs: 1
    warmup_steps: 500
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 2
    weight_decay: 0.01
    logging_steps: 10
    evaluation_strategy: steps
    eval_steps: 500
    save_steps: 1000
    gradient_accumulation_steps: 8
    learning_rate: 5.0e-5
    report_to:
      - none
    predict_with_generate: true
  hyperparameter_search:
    enabled: false
    backend: optuna
    direction: minimize
    n_trials: 10
    params:
      learning_rate:
        distribution: float
        low: 1.0e-5
        high: 5.0e-4
        log: true
      per_device_train_batch_size:
        distribution: categorical
        values: [2, 4, 8]
      num_train_epochs:
        distribution: int
        low: 1
        high: 3
        step: 1
experiment_tracking:
  enabled: false
  backend: local
  project: text-summarizer
  entity:
  run_name:
  tags: []
  mode: offline
